<div class="banner">
    <div class="navbar">
      <ul>
        <li><a routerLink="/">Accueil</a></li>
        <li><a routerLink="/messagerie">Messagerie</a></li>
        <li><a routerLink="/" (click)="logout()">Déconnexion</a></li>
      </ul>
    </div>
    <div class="content">
      <h2>Espace Personnel</h2>
      <p *ngIf="user">Bienvenue, {{ user.prenom }} {{ user.nom }} !</p>
      <p *ngFor="let message of messages" class="info">{{ message }}</p>

      <div class="actions" *ngIf="!edition">
        <button (click)="navigateTo('planning')"><span></span>Voir le planning</button>
        <button (click)="navigateTo('saisie')"><span></span>Saisir mes indisponibilités</button>
        <button (click)="modifier()" [disabled]="!user"><span></span>Modifier mes informations</button>
      </div>

      <form *ngIf="edition" (ngSubmit)="enregistrer()">
        <label for="prenom">Prénom</label>
        <input id="prenom" name="prenom" type="text" [(ngModel)]="edition.prenom" required />
        <label for="nom">Nom</label>
        <input id="nom" name="nom" type="text" [(ngModel)]="edition.nom" required />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="edition.email" required />
        <label for="date_naiss">Date de naissance</label>
        <input id="date_naiss" name="date_naiss" type="date" [(ngModel)]="edition.date_naiss" required />
        <button type="submit"><span></span>Enregistrer</button>
        <button type="button" (click)="edition = null"><span></span>Annuler</button>
      </form>
    </div>
  </div>
